[project]
name = "bangji-evaluator"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.32", "pydantic>=2.9", "sse-starlette>=2.1",
  "agent-framework", "agent-framework-github-copilot", "github-copilot-sdk",
  "azure-monitor-opentelemetry>=1.6",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
